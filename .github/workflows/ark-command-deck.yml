name: ARK Command Deck — PowerShell 7 safety checks

on:
  pull_request:
    paths:
      - "windows-terminal/**"
      - ".github/workflows/ark-command-deck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-tests:
    name: Theme installer and rollback — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell syntax
        run: |
          $paths = @(
            'windows-terminal/ARK-CommandDeck.ps1',
            'windows-terminal/Install-ARKCommandDeck.ps1',
            'windows-terminal/Test-ARKCommandDeck.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell parse errors in $path"
            }
          }
      - name: Validate Terminal fragment
        run: |
          $theme = Get-Content -LiteralPath windows-terminal/ARK-Deepwater.fragment.json -Raw |
            ConvertFrom-Json
          if ($theme.schemes.Count -ne 1 -or $theme.schemes[0].name -ne 'ARK Deepwater') {
            throw 'Invalid ARK color scheme'
          }
          if ($theme.profiles.Count -ne 1 -or $theme.profiles[0].commandline -ne 'pwsh.exe -NoLogo') {
            throw 'Invalid ARK PowerShell 7 profile'
          }
      - name: Test preview, install, rollback and idempotence
        run: pwsh -NoLogo -NoProfile -File windows-terminal/Test-ARKCommandDeck.ps1
